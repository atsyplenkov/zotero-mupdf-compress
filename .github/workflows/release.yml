name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
# A second tag must wait. Cancelling a publish, or dropping the run that is
# waiting, would skip an XPI or leave update.json half replaced.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # cache: true matches the check workflow. mise.lock pins the tools.
      # jactionlint ignore=cache-poisoning
      - name: Toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true
          persist_github_token: false
      - name: Dependencies
        run: npm ci
      - name: Release
        run: npx zotero-plugin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
