name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
# A second tag must wait. Cancelling a publish, or dropping the run that is
# waiting, would skip an XPI or leave update.json half replaced.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        with:
          cache: false
          persist_github_token: false
      - name: Dependencies
        run: npm ci
      - name: Require the version tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" != "refs/tags/v${version}" ]; then
            echo "Push tag must match v${version}" >&2
            exit 1
          fi
          head=$(git rev-parse HEAD)
          tag=$(git rev-parse --verify "refs/tags/v${version}^{}")
          test "$head" = "$tag"
      - name: Refuse an older publish
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/refuse-older-update.mjs "$version"
          url=https://github.com/atsyplenkov/zotero-mupdf-compress/releases/download/release/update.json
          feed=$(mktemp)
          trap 'rm -f "$feed"' EXIT
          if ! status=$(curl -sSL -w '%{http_code}' -o "$feed" "$url"); then
            echo "Could not download update.json" >&2
            exit 1
          fi
          case "$status" in
            200) node scripts/refuse-older-update.mjs "$version" "$feed" ;;
            404) echo "No published update.json found" ;;
            *) echo "Could not download update.json: HTTP $status" >&2; exit 1 ;;
          esac
      - name: Release
        run: npx zotero-plugin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the MuPDF source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          url=$(node -p "require('./addon/native/digests.json').source")
          sum=$(node -p "require('./addon/native/digests.json').sourceSha256")
          name=$(basename "$url")
          curl -fsSL "$url" -o "$name"
          echo "$sum  $name" | sha256sum -c -
          gh release upload "v${version}" "$name" --clobber
