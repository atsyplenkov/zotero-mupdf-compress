name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
# A second tag must wait. Cancelling a publish, or dropping the run that is
# waiting, would skip an XPI or leave update.json half replaced.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          cache: false
          persist_github_token: false
      - name: Dependencies
        run: npm ci
      - name: Require an eligible version tag
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/refuse-older-update.mjs "$version" --check-tag
      - name: Refuse an older publish
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/refuse-older-update.mjs "$version"
          url=https://github.com/atsyplenkov/zotero-mupdf-compress/releases/download/release/update.json
          feed=$(mktemp)
          trap 'rm -f "$feed"' EXIT
          if ! status=$(curl -sSL -w '%{http_code}' -o "$feed" "$url"); then
            echo "Could not download update.json" >&2
            exit 1
          fi
          case "$status" in
            200) node scripts/refuse-older-update.mjs "$version" "$feed" ;;
            404) echo "No published update.json found" ;;
            *) echo "Could not download update.json: HTTP $status" >&2; exit 1 ;;
          esac
      - name: Publish release
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
