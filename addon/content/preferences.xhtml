<groupbox>
  <description>Compress PDF attachments with the bundled MuPDF engine.</description>
  <hbox align="center">
    <html:label for="mupdf-compress-temporary-folder">Temporary folder</html:label>
    <html:input
      type="text"
      id="mupdf-compress-temporary-folder"
      preference="extensions.mupdf-compress.temporaryFolder"
      style="width: 100%;"
    ></html:input>
  </hbox>
  <description>Leave blank to use Zotero's temporary directory. The folder must already exist and be writable. Changes take effect on the next Zotero launch.</description>
</groupbox>
