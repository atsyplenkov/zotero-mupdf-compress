<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        title="MuPDF Compress" orient="vertical">
  <script src="chrome://mupdf-compress/content/queue.js"/>
  <vbox style="padding: 16px; min-width: 560px;" flex="1">
    <html:h3 id="headline" style="margin: 0 0 8px;"/>
    <progressmeter id="bar" mode="determined" value="0" max="100"/>
    <html:table style="border-collapse: collapse; width: 100%; margin-top: 12px;">
      <html:thead>
        <html:tr>
          <html:th style="width: 24px;"/>
          <html:th style="text-align: left; padding: 4px 8px;">File</html:th>
          <html:th style="text-align: left; padding: 4px 8px;">Before</html:th>
          <html:th style="text-align: left; padding: 4px 8px;">After</html:th>
          <html:th style="text-align: left; padding: 4px 8px;">Saved</html:th>
        </html:tr>
      </html:thead>
      <html:tbody id="tbody"/>
    </html:table>
    <hbox pack="end" style="margin-top: 16px;">
      <button id="action" label="Cancel"/>
    </hbox>
  </vbox>
  <menupopup id="revert-popup">
    <menuitem id="revert-item" label="Revert"/>
  </menupopup>
</window>
